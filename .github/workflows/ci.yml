name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin npm
        run: npm install --global npm@11.6.2
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --package-lock-only --ignore-scripts
            npm ci
          fi
      - name: Commit lockfile on main after first successful install
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('package-lock.json') != '' }}
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock production dependencies"
          git push
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - name: Test game engine
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Live multiplayer backend smoke test
        env:
          BACKEND_SMOKE_URL: https://nowlwprtcnieihelqjoa.supabase.co/functions/v1/most_likely-game-api
        run: node scripts/smoke-backend.mjs
